<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Watch Marker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <section id="mark">
      <header class="status">
        <span id="chip" class="chip"></span>
        <p id="state" class="state"></p>
      </header>
      <div id="actions"></div>
    </section>

    <section id="empty" class="status" hidden>
      <span class="chip" data-icon="unmarked"></span>
      <p class="state">Open A Video To Mark Its Status</p>
    </section>

    <p id="msg" class="msg" role="status" aria-live="polite"></p>

    <footer>
      <button id="export" type="button" class="link"><span data-icon="export"></span>Export</button>
      <button id="import" type="button" class="link"><span data-icon="import"></span>Import</button>
      <input id="file" type="file" accept="application/json,.json" hidden>
    </footer>
  </main>
  <script src="../scripts/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
